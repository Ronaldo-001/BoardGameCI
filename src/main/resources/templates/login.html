<!DOCTYPE html>
<html xmlns:th="http://www.thymleaf.org">

<head th:replace="fragments/header.html :: html-head(title='Log In!')"></head>

<body>
    <nav th:replace="fragments/links :: nav.navigation-links"></nav>
    <main class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="game-info-card fade-in">
                    <div class="text-center mb-4">
                        <i class="fas fa-sign-in-alt fa-3x text-primary mb-3"></i>
                        <h1 class="text-gradient">Welcome Back</h1>
                        <p class="text-muted">Sign in to your BoardGame Hub account</p>
                    </div>

                    <!-- Error Messages -->
                    <div th:if="${param.error}" class="error fade-in">
                        <i class="fas fa-exclamation-triangle me-2"></i>
                        Invalid username or password. Please try again.
                    </div>
                    <div th:if="${param.logout}" class="success fade-in">
                        <i class="fas fa-check-circle me-2"></i>
                        You have been successfully logged out.
                    </div>

                    <!-- Login Form -->
                    <form action="#" th:action="@{/login}" method="post" class="fade-in">
                        <div class="mb-4">
                            <label for="inputUserName" class="form-label">
                                <i class="fas fa-user me-2"></i>
                                Username
                            </label>
                            <input type="text" name="username" class="form-control" id="inputUserName"
                                placeholder="Enter your username" required>
                        </div>
                        
                        <div class="mb-4">
                            <label for="inputPassword" class="form-label">
                                <i class="fas fa-lock me-2"></i>
                                Password
                            </label>
                            <input type="password" name="password" class="form-control" id="inputPassword"
                                placeholder="Enter your password" required>
                        </div>
                        
                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary btn-lg">
                                <i class="fas fa-sign-in-alt me-2"></i>
                                Sign In
                            </button>
                        </div>
                    </form>

                    <!-- Additional Links -->
                    <div class="text-center mt-4">
                        <hr class="my-4">
                        <p class="text-muted mb-3">Don't have an account yet?</p>
                        <a href="#" th:href="@{/newUser}" class="btn btn-outline-primary">
                            <i class="fas fa-user-plus me-2"></i>
                            Create Account
                        </a>
                        <div class="mt-3">
                            <a href="/" th:href="@{/}" class="text-decoration-none">
                                <i class="fas fa-arrow-left me-1"></i>
                                Back to Home
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <div class="b-example-divider border border-light"></div>
    <div th:include="fragments/links :: div.bottom-links"></div>
    <div th:replace="fragments/footer.html :: page-footer"></div>
</body>

</html>
