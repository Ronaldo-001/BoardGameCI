<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Links</title>
</head>

<body>
    <nav class="navigation-links navbar navbar-expand-lg navbar-light p-3">
        <div class="container-fluid">
            <a class="navbar-brand d-flex align-items-center" href="/">
                <i class="fas fa-dice-d20 me-2 text-primary"></i>
                <span class="fw-bold">BoardGame Hub</span>
            </a>
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse justify-content-end" id="navbarSupportedContent">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a href="#" th:href="@{/}" class="nav-link d-flex align-items-center" aria-current="page">
                            <i class="fas fa-home me-1"></i>
                            Home
                        </a>
                    </li>
                    <li sec:authorize="!hasRole('ROLE_USER')" class="nav-item">
                        <a href="#" th:href="@{/login}" class="nav-link d-flex align-items-center">
                            <i class="fas fa-sign-in-alt me-1"></i>
                            Login
                        </a>
                    </li>
                    <li sec:authorize="!hasRole('ROLE_USER')" class="nav-item">
                        <a href="#" th:href="@{/newUser}" class="nav-link d-flex align-items-center">
                            <i class="fas fa-user-plus me-1"></i>
                            Sign Up
                        </a>
                    </li>
                    <li sec:authorize="hasRole('ROLE_USER')" class="nav-item">
                        <form action="#" th:action="@{/logout}" method="post" class="d-inline">
                            <button class="nav-link btn btn-link p-0 d-flex align-items-center" type="submit">
                                <i class="fas fa-sign-out-alt me-1"></i>
                                Logout
                            </button>
                        </form>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="bottom-links">
        <div class="d-flex flex-wrap justify-content-center pt-3">
            <a href="#">About</a> &nbsp;
            <a href="#">Contact</a>
        </div>
    </div>
</body>

</html>
