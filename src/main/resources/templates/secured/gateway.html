<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org"
    xmlns:sec="https://www.thymeleaf.org/thymeleaf-extras-springsecurity5">

<head th:replace="fragments/header.html :: html-head(title='Secured Section!')"></head>

<body>
    <nav th:replace="fragments/links :: nav.navigation-links"></nav>
    <main class="container">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <!-- Welcome Section -->
                <div class="hero-section fade-in">
                    <h1 class="text-gradient">🎉 Welcome Back!</h1>
                    <p class="lead">You are successfully logged in to BoardGame Hub</p>
                </div>

                <!-- User Info Card -->
                <div class="game-info-card fade-in-up">
                    <div th:if="${message}" class="error mb-4">
                        <i class="fas fa-exclamation-triangle me-2"></i>
                        <span th:text="${message}"></span>
                    </div>
                    
                    <div class="row">
                        <div class="col-md-6 mb-4">
                            <div class="info-item">
                                <h5>
                                    <i class="fas fa-user me-2 text-primary"></i>
                                    Username
                                </h5>
                                <p class="mb-0 fw-bold" sec:authentication="name">User</p>
                            </div>
                        </div>
                        <div class="col-md-6 mb-4">
                            <div class="info-item">
                                <h5>
                                    <i class="fas fa-shield-alt me-2 text-primary"></i>
                                    Role
                                </h5>
                                <p class="mb-0 fw-bold" sec:authentication="principal.authorities">Role</p>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Action Buttons -->
                <div class="text-center mt-5 fade-in">
                    <div class="row">
                        <div class="col-md-6 mb-3" sec:authorize="hasRole('ROLE_USER')">
                            <a href="#" th:href="@{/user}" class="btn btn-primary btn-lg w-100">
                                <i class="fas fa-user me-2"></i>
                                User Dashboard
                            </a>
                        </div>
                        <div class="col-md-6 mb-3" sec:authorize="hasRole('ROLE_MANAGER')">
                            <a href="#" th:href="@{/manager}" class="btn btn-warning btn-lg w-100">
                                <i class="fas fa-crown me-2"></i>
                                Manager Panel
                            </a>
                        </div>
                    </div>
                    
                    <div class="d-flex justify-content-center gap-3 flex-wrap mt-4">
                        <a href="#" th:href="@{/}" class="btn btn-outline-secondary">
                            <i class="fas fa-home me-2"></i>
                            Back to Home
                        </a>
                        <form action="#" th:action="@{/logout}" method="post" class="d-inline">
                            <button type="submit" class="btn btn-outline-danger">
                                <i class="fas fa-sign-out-alt me-2"></i>
                                Logout
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <div class="b-example-divider border border-light"></div>
    <div th:include="fragments/links :: div.bottom-links"></div>
    <div th:replace="fragments/footer.html :: page-footer"></div>
</body>

</html>
