<!DOCTYPE html>
<html xmlns:th="http://www.thymleaf.org" xmlns:sec="https://www.thymeleaf.org/thymeleaf-extras-springsecurity5">

<head th:replace="fragments/header.html :: html-head(title='Create Account')"></head>

<body>
    <nav th:replace="fragments/links :: nav.navigation-links"></nav>
    <main class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="game-info-card fade-in">
                    <div class="text-center mb-4">
                        <i class="fas fa-user-plus fa-3x text-primary mb-3"></i>
                        <h1 class="text-gradient">Create Account</h1>
                        <p class="text-muted">Join the BoardGame Hub community</p>
                    </div>

                    <!-- Error Messages -->
                    <div id="error" class="fade-in">
                        <div th:if="${errorMsg}" class="error">
                            <i class="fas fa-exclamation-triangle me-2"></i>
                            <span th:text="${errorMsg}"></span>
                        </div>
                    </div>

                    <!-- Registration Form -->
                    <form name="form" action="#" th:action="@{/addUser}" method="post" onsubmit="return verify()" class="fade-in">
                        <div class="mb-4">
                            <label for="inputUserName" class="form-label">
                                <i class="fas fa-user me-2"></i>
                                Username
                            </label>
                            <input type="text" name="userName" class="form-control" id="inputUserName"
                                placeholder="Choose a username" required>
                        </div>
                        
                        <div class="mb-4">
                            <label for="inputPassword" class="form-label">
                                <i class="fas fa-lock me-2"></i>
                                Password
                            </label>
                            <input type="password" name="password" class="form-control" id="inputPassword"
                                placeholder="Create a password" required>
                        </div>
                        
                        <div class="mb-4">
                            <label class="form-label">
                                <i class="fas fa-shield-alt me-2"></i>
                                Account Type
                            </label>
                            <div class="row" th:each="authority:${authorities}">
                                <div class="col-12">
                                    <div class="form-check">
                                        <input type="checkbox" name="authorities" th:value="${authority}" th:id="${authority}" 
                                               class="form-check-input">
                                        <label th:for="${authority}" th:text="${authority}" class="form-check-label">
                                        </label>
                                    </div>
                                </div>
                            </div>
                        </div>
                        
                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary btn-lg">
                                <i class="fas fa-user-plus me-2"></i>
                                Create Account
                            </button>
                        </div>
                    </form>

                    <!-- Additional Links -->
                    <div class="text-center mt-4">
                        <hr class="my-4">
                        <p class="text-muted mb-3">Already have an account?</p>
                        <a href="#" th:href="@{/login}" class="btn btn-outline-primary">
                            <i class="fas fa-sign-in-alt me-2"></i>
                            Sign In
                        </a>
                        <div class="mt-3">
                            <a href="/" th:href="@{/}" class="text-decoration-none">
                                <i class="fas fa-arrow-left me-1"></i>
                                Back to Home
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <div class="b-example-divider border border-light"></div>
    <div th:include="fragments/links :: div.bottom-links"></div>
    <div th:replace="fragments/footer.html :: page-footer"></div>
</body>

</html>
